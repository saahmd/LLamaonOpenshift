---
- name: Interact with Ansible Lightspeed API and Generate Ansible Playbook
  hosts: localhost
  gather_facts: false
  vars:
    lightspeed_custom_prompt: !unsafe >-
      Generate a multi-task Ansible playbook to resolve the RCA in {goal}.
      Use ansible.builtin.uri for all Kubernetes API calls.
      Never use k8s modules. Include inspect, patch, and verify tasks.
      Use the service-account token and CA bundle for auth.
      Include a rescue block. No debug-only playbooks.
  tasks:
    # ==================================================================
    # TEST 1: Minimal payload — just text + model (this worked before)
    # ==================================================================
    # ==================================================================
    # TEST 2: Add customPrompt with {goal}
    # ==================================================================
    - name: "TEST 2 — add customPrompt"
      ansible.builtin.uri:
        url: "{{ input_lightspeed_url }}"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ lightspeed_wca_token | default('redhat') }}"
        body_format: json
        body:
          text: "{{ lightspeed_prompt }}"
          model: "{{ lightspeed_model }}"
          customPrompt: "{{ lightspeed_custom_prompt }}"
        validate_certs: false
        status_code: [200, 400, 500]
        timeout: 120
      register: test2
 
    - name: "TEST 2 result"
      ansible.builtin.debug:
        msg: "Status: {{ test2.status }} — {{ test2.json | default(test2.msg) }}"

