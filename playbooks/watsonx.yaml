---
- name: Interact with Ansible Lightspeed API and Generate Ansible Playbook
  hosts: localhost
  gather_facts: false
  vars:
    lightspeed_custom_prompt: !unsafe |
      You are an Ansible playbook generator for OpenShift-based IMS remediation.
      Your ONLY job is to produce a playbook that resolves the issue described
      in the following incident context:
 
      {goal}
 
      CRITICAL: A debug-only playbook that merely prints the RCA summary is
      NEVER a valid remediation. You must produce real ansible.builtin.uri tasks
      that make actual Kubernetes API calls to fix the problem.
 
      ENVIRONMENT RULES:
      1. ALL Kubernetes/OpenShift API calls use ansible.builtin.uri — never
         k8s, kubernetes.core.k8s, or community.kubernetes modules.
      2. Authenticate with the in-cluster service-account:
           token:   lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token')
           ca_path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
           API base: https://kubernetes.default.svc
      3. Use ONLY namespaces, deployments, configmaps explicitly named in the
         incident context above. Never invent resource names.
      4. All mutations must be idempotent — use PATCH method with
         Content-Type: application/strategic-merge-patch+json.
      5. No destructive, irreversible, or environment-wide changes.
      6. If safe remediation is not possible, use ansible.builtin.fail with
         a clear explanation.
 
      YAML RULES:
      - Quote any scalar containing ': ' or Jinja2 double-brace expressions
      - For messages use msg: >- or double-quoted strings
      - Define reusable values (API URL, token, headers) in vars
 
      REQUIRED APPROACH:
      - Inspect affected resources (GET) before changing anything
      - Apply targeted changes (PATCH annotations, scale, configmaps)
      - Use when: conditions to skip if already resolved
      - Verify changes took effect where practical
      - Include a rescue block for failure handling 
  tasks:
    # ==================================================================
    # TEST 1: Minimal payload — just text + model (this worked before)
    # ==================================================================
    - name: "TEST 1 — minimal payload (text + model only)"
      ansible.builtin.uri:
        url: "{{ input_lightspeed_url }}"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ lightspeed_wca_token | default('redhat') }}"
        body_format: json
        body:
          text: "{{ lightspeed_prompt }}"
          model: "{{ lightspeed_model }}"
        validate_certs: false
        status_code: [200, 400, 500]
        timeout: 120
      register: test1
 
    - name: "TEST 1 result"
      ansible.builtin.debug:
        msg: "Status: {{ test1.status }} — {{ test1.json | default(test1.msg) }}"

    # ==================================================================
    # TEST 2: Add customPrompt with {goal}
    # ==================================================================
    - name: "TEST 2 — add customPrompt"
      ansible.builtin.uri:
        url: "{{ input_lightspeed_url }}"
        method: POST
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ lightspeed_wca_token | default('redhat') }}"
        body_format: json
        body:
          text: "{{ lightspeed_prompt }}"
          model: "{{ lightspeed_model }}"
          customPrompt: "{{ lightspeed_custom_prompt }}"
        validate_certs: false
        status_code: [200, 400, 500]
        timeout: 120
      register: test2
 
    - name: "TEST 2 result"
      ansible.builtin.debug:
        msg: "Status: {{ test2.status }} — {{ test2.json | default(test2.msg) }}"

